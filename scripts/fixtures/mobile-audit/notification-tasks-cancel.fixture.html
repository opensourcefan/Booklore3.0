<!--
  Golden fixture: Tasks tab cancel control on phone (375×667).
  Not part of the Angular app — do not import into fable-ui.
  Mirrors unified-notification-popover Tasks panel + metadata cancel.
-->
<div class="mobile-notifications-popover phone-viewport">
  <div class="metadata-progress-box">
    <div class="tasks-panel">
      <div class="task-border">
        <div class="task-card">
          <div class="task-header-row">
            <span class="task-title">Metadata refresh</span>
            <span class="task-status">IN_PROGRESS</span>
          </div>
          <div class="task-progress">42 / 100</div>
          <div class="action-buttons">
            <button type="button" class="cancel-task-btn" aria-label="Cancel task">
              <i class="pi pi-stop"></i>
              <span>Cancel</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
