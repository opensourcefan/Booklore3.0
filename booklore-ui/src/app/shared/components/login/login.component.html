<ng-container *transloco="let t; prefix: 'auth.login'">
  <div class="login-container">
    <div class="login-card-wrapper">
      <div class="login-card-border">
        <div class="login-card">
          <div class="login-header">
            <div class="logo-wrapper">
              <svg class="logo-icon" viewBox="-2.5 0 19 19" fill="var(--primary-color)" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.902 14.114V4.337l1.108 1.108v9.777H2.652A1.664 1.664 0 0 1 .99 13.559V4.9a1.665 1.665 0 0 1 1.662-1.663h.664V7.25l.874-.645.875.645V3.236h5.729v9.77h-7.85a.978.978 0 0 0-.626.111.56.56 0 0 0-.006.88.613.613 0 0 0 .39.117h9.2z"/>
              </svg>
            </div>
            <h1 class="login-title">{{ t('title') }}</h1>
            <p class="login-subtitle">{{ t('subtitle') }}</p>
          </div>

          @if (infoMessage) {
            <div class="info-message" style="margin-bottom: 1rem;">
              <p-message severity="info">{{ infoMessage }}</p-message>
            </div>
          }

          @if (errorMessage) {
            <div class="error-message" style="margin-bottom: 1rem;">
              <p-message severity="error">{{ errorMessage }}</p-message>
            </div>
          }

          @if (showLocalLogin) {
            <form class="login-form" #loginForm="ngForm" (ngSubmit)="login()">
              <div class="form-field">
                <label for="username" class="form-label">
                  <i class="pi pi-user"></i>
                  <span>{{ t('usernameLabel') }}</span>
                </label>
                <input
                  fluid
                  pInputText
                  id="username"
                  name="username"
                  required
                  [(ngModel)]="username"
                  [placeholder]="t('usernamePlaceholder')"
                  class="form-input"
                  autocomplete="username"
                />
              </div>

              <div class="form-field">
                <label for="password" class="form-label">
                  <i class="pi pi-lock"></i>
                  <span>{{ t('passwordLabel') }}</span>
                </label>
                <p-password
                  id="password"
                  name="password"
                  required
                  [(ngModel)]="password"
                  [feedback]="false"
                  [placeholder]="t('passwordPlaceholder')"
                  [toggleMask]="true"
                  [fluid]="true"
                  autocomplete="current-password"
                ></p-password>
              </div>

              <p-button
                fluid
                type="submit"
                [label]="t('signIn')"
                icon="pi pi-sign-in"
                [disabled]="!loginForm.valid || !username || !password"
                class="login-button">
              </p-button>

              @if (oidcEnabled) {
                <div class="divider">
                  <span>{{ t('orContinueWith') }}</span>
                </div>

                <p-button
                  fluid
                  severity="secondary"
                  [label]="isOidcLoginInProgress ? t('redirectingTo', {provider: oidcName}) : oidcName"
                  [icon]="isOidcLoginInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-id-card'"
                  [disabled]="isOidcLoginInProgress"
                  (click)="loginWithOidc()"
                  class="oidc-button"/>
              }
            </form>
          } @else {
            @if (oidcEnabled) {
              <div class="login-form">
                <p-button
                  fluid
                  severity="secondary"
                  [label]="isOidcLoginInProgress ? t('redirectingTo', {provider: oidcName}) : oidcName"
                  [icon]="isOidcLoginInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-id-card'"
                  [disabled]="isOidcLoginInProgress"
                  (click)="loginWithOidc()"
                  class="oidc-button"/>
              </div>
            }
          }
        </div>
      </div>
    </div>
  </div>
</ng-container>
