<ng-container *transloco="let t; prefix: 'auth.login'">
  <div class="login-container">
    <div class="login-card-wrapper">
      <div class="login-card-border">
        <div class="login-card">
          <div class="login-header">
            <div class="logo-wrapper">
              <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 9H28C28 9 29 9 29 10V30C29 30 29 31 28 31H4C4 31 3 31 3 30V5M3 5C3 1 7 1 7 1H29M3 5C3 9 7 9 7 9M7 5V17L10 15L13 17V5H27" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="login-title">{{ t('title') }}</h1>
            <p class="login-subtitle">{{ t('subtitle') }}</p>
          </div>

          @if (infoMessage) {
            <div class="info-message" style="margin-bottom: 1rem;">
              <p-message severity="info">{{ infoMessage }}</p-message>
            </div>
          }

          @if (errorMessage) {
            <div class="error-message" style="margin-bottom: 1rem;">
              <p-message severity="error">{{ errorMessage }}</p-message>
            </div>
          }

          @if (showLocalLogin) {
            <form class="login-form" #loginForm="ngForm" (ngSubmit)="login()">
              <div class="form-field">
                <label for="username" class="form-label">
                  <i class="pi pi-user"></i>
                  <span>{{ t('usernameLabel') }}</span>
                </label>
                <input
                  fluid
                  pInputText
                  id="username"
                  name="username"
                  required
                  [(ngModel)]="username"
                  [placeholder]="t('usernamePlaceholder')"
                  class="form-input"
                  autocomplete="username"
                />
              </div>

              <div class="form-field">
                <label for="password" class="form-label">
                  <i class="pi pi-lock"></i>
                  <span>{{ t('passwordLabel') }}</span>
                </label>
                <p-password
                  id="password"
                  name="password"
                  required
                  [(ngModel)]="password"
                  [feedback]="false"
                  [placeholder]="t('passwordPlaceholder')"
                  [toggleMask]="true"
                  [fluid]="true"
                  autocomplete="current-password"
                ></p-password>
              </div>

              <p-button
                fluid
                type="submit"
                [label]="t('signIn')"
                icon="pi pi-sign-in"
                [disabled]="!loginForm.valid || !username || !password"
                class="login-button">
              </p-button>

              @if (oidcEnabled) {
                <div class="divider">
                  <span>{{ t('orContinueWith') }}</span>
                </div>

                <p-button
                  fluid
                  severity="secondary"
                  [label]="isOidcLoginInProgress ? t('redirectingTo', {provider: oidcName}) : oidcName"
                  [icon]="isOidcLoginInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-id-card'"
                  [disabled]="isOidcLoginInProgress"
                  (click)="loginWithOidc()"
                  class="oidc-button"/>
              }
            </form>
          } @else {
            @if (oidcEnabled) {
              <div class="login-form">
                <p-button
                  fluid
                  severity="secondary"
                  [label]="isOidcLoginInProgress ? t('redirectingTo', {provider: oidcName}) : oidcName"
                  [icon]="isOidcLoginInProgress ? 'pi pi-spin pi-spinner' : 'pi pi-id-card'"
                  [disabled]="isOidcLoginInProgress"
                  (click)="loginWithOidc()"
                  class="oidc-button"/>
              </div>
            }
          }
        </div>
      </div>
    </div>
  </div>
</ng-container>
