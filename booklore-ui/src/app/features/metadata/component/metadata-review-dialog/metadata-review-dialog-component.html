<div class="metadata-review-container">
  <div class="panel-header">
    <div class="header-icon-wrapper">
      <i class="pi pi-pencil header-icon"></i>
    </div>
    <div class="header-text">
      <h2 class="panel-title">Metadata Review</h2>
      <p class="panel-description">Review and accept fetched metadata</p>
    </div>
    <p-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (click)="close()"
      class="close-button">
    </p-button>
  </div>

  @if (!loading) {
    <div class="dialog-content">
      @if (currentProposal?.metadataJson; as proposed) {
        <app-metadata-picker
          [fetchedMetadata]="proposed"
          [book$]="book$"
          (goBack)="close()"
          [reviewMode]="true"
          [reviewQuickActionLabel]="quickActionLabel"
          [reviewActionBusy]="processingAction === 'quick'"
          [reviewActionDisabled]="isBusy && processingAction !== 'quick'"
          [reviewSecondaryActionLabel]="tagActionLabel"
          [reviewSecondaryActionBusy]="processingAction === 'tag'"
          [reviewSecondaryActionDisabled]="(isBusy && processingAction !== 'tag') || !currentBook"
          (reviewQuickAction)="onCopyAllSaveAndAdvance()"
          (reviewSecondaryAction)="onTagAndAdvance()">
        </app-metadata-picker>
      }
    </div>

    <div class="dialog-footer">
      <div class="footer-left-actions">
        <p-button
          label="Lock All"
          icon="pi pi-lock"
          severity="warn"
          [outlined]="true"
          [disabled]="isBusy"
          (click)="lockAllMetadata()">
        </p-button>

        <p-button
          label="Unlock All"
          icon="pi pi-lock-open"
          severity="success"
          [outlined]="true"
          [disabled]="isBusy"
          (click)="unlockAllMetadata()">
        </p-button>
      </div>

      <div class="footer-info">
        <div class="progress-group" pTooltip="{{ currentIndex + 1 }} of {{ proposals.length }} processed ({{ ((currentIndex + 1) / proposals.length * 100) | number: '1.0-0' }}%)" tooltipPosition="top">
          <p-progressBar
            [value]="((currentIndex + 1) / proposals.length) * 100"
            class="progress-bar"
            showValue="false">
          </p-progressBar>
          <span class="progress-text">
            Book {{ currentIndex + 1 }} / {{ proposals.length }}
          </span>
        </div>
      </div>

      <div class="footer-right-actions">
        <p-button
          icon="pi pi-angle-left"
          severity="secondary"
          [outlined]="true"
          [disabled]="isBusy"
          pTooltip="Copy missing fields"
          tooltipPosition="top"
          (click)="onCopyMissing()">
        </p-button>

        <p-button
          icon="pi pi-angle-double-left"
          severity="primary"
          [outlined]="true"
          [disabled]="isBusy"
          pTooltip="Copy all fields"
          tooltipPosition="top"
          (click)="onCopyAll()">
        </p-button>

        <p-button
          label="Skip"
          icon="pi pi-forward"
          severity="secondary"
          [outlined]="true"
          [disabled]="isBusy"
          (click)="onSkip()">
        </p-button>

        <p-button
          label="Accept & Save"
          icon="pi pi-check-circle"
          iconPos="right"
          severity="success"
          [outlined]="true"
          [loading]="processingAction === 'save'"
          [disabled]="isBusy && processingAction !== 'save'"
          (click)="onSave()">
        </p-button>

        <p-button
          [label]="isLast ? 'Finish & Close' : 'Next'"
          [icon]="isLast ? 'pi pi-check-circle' : 'pi pi-angle-right'"
          iconPos="right"
          severity="info"
          [outlined]="true"
          [disabled]="isBusy"
          (click)="onNext()">
        </p-button>
      </div>
    </div>
  } @else {
    <div class="dialog-content loading-state">
      <p-progressSpinner class="spinner" strokeWidth="4"></p-progressSpinner>
    </div>
  }
</div>
