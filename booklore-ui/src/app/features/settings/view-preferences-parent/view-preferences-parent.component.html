<ng-container *transloco="let t; prefix: 'settingsView'">
  <div class="preferences-container">
    <div class="settings-header">
      <h2 class="settings-title">
        <i class="pi pi-eye"></i>
        {{ t('title') }}
      </h2>
      <p class="settings-description">
        {{ t('description') }}
      </p>
    </div>

    <app-view-preferences></app-view-preferences>
    <div class="section-divider"><hr></div>
    <app-filter-preferences></app-filter-preferences>
    <div class="section-divider"><hr></div>
    <app-sidebar-sorting-preferences></app-sidebar-sorting-preferences>
    <div class="section-divider"><hr></div>
    <app-meta-center-view-mode-component></app-meta-center-view-mode-component>
    <div class="section-divider"><hr></div>

    <div class="preferences-section">
      <div class="section-header">
        <h3 class="section-title">
          <i class="pi pi-image"></i>
          Cover Preview
        </h3>
      </div>
      <div class="settings-card">
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-label-row">
              <span class="setting-label">Show cover preview panel</span>
              <p-toggleswitch
                [(ngModel)]="showCoverPreview"
                (onChange)="onCoverPreviewToggle($event.checked)">
              </p-toggleswitch>
            </div>
            <p class="setting-description">
              <i class="pi pi-info-circle"></i>
              When enabled, hovering over a book shows its cover in the filter sidebar.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
