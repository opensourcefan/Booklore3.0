@if (isLoading) {
  <div class="loading-container">
    <p-progressSpinner></p-progressSpinner>
  </div>
}

@if (!isLoading) {
  <ngx-extended-pdf-viewer
    [src]="bookData"
    [authorization]="authorization"
    [textLayer]="true"
    [showHandToolButton]="true"
    [height]="'auto'"
    [theme]="isDarkTheme ? 'dark' : 'light'"
    [page]="page"
    [rotation]="rotation"
    [zoom]="zoom"
    [spread]="spread"
    [enablePrint]="canPrint"
    [customToolbar]="additionalButtons"
    (pagesLoaded)="onPdfPagesLoaded($event)"
    (pageChange)="onPageChange($event)"
    (zoomChange)="onZoomChange($event)"
    (spreadChange)="onSpreadChange($event)"
    (annotationEditorEvent)="onAnnotationEditorEvent()"
    (annotationLayerRendered)="onAnnotationLayerRendered($event)"
    (linkAnnotationsAdded)="onLinkAnnotationsAdded($event)">
  </ngx-extended-pdf-viewer>

  <ng-template #additionalButtons>
    <div id="toolbarViewer">
      <div id="toolbarViewerLeft">
        <pdf-toggle-sidebar></pdf-toggle-sidebar>
        <pdf-find-button></pdf-find-button>
        <pdf-paging-area></pdf-paging-area>
      </div>
      <pdf-zoom-toolbar></pdf-zoom-toolbar>
      <div id="toolbarViewerRight" [class.pdf-dark]="isDarkTheme">
        <button class="toolbar-btn bookmark-btn" [class.active]="isCurrentPageBookmarked" [title]="isCurrentPageBookmarked ? ('readerPdf.toolbar.removeBookmark' | transloco) : ('readerPdf.toolbar.addBookmark' | transloco)" (click)="onToggleBookmark()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isCurrentPageBookmarked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
          </svg>
        </button>
        <div class="verticalToolbarSeparator"></div>
        <pdf-hand-tool></pdf-hand-tool>
        <pdf-select-tool></pdf-select-tool>
        <pdf-rotate-page></pdf-rotate-page>
        @if (canPrint) {
          <pdf-print></pdf-print>
        }
        <pdf-no-spread></pdf-no-spread>
        <pdf-even-spread></pdf-even-spread>
        <pdf-odd-spread></pdf-odd-spread>
        <pdf-infinite-scroll></pdf-infinite-scroll>
        <pdf-horizontal-scroll></pdf-horizontal-scroll>
        <pdf-vertical-scroll-mode></pdf-vertical-scroll-mode>
        <pdf-wrapped-scroll-mode></pdf-wrapped-scroll-mode>
        <pdf-single-page-mode></pdf-single-page-mode>
        <pdf-book-mode></pdf-book-mode>
        <div class="verticalToolbarSeparator hiddenSmallView"></div>
        <pdf-toggle-secondary-toolbar></pdf-toggle-secondary-toolbar>
        <div class="verticalToolbarSeparator"></div>
        <pdf-highlight-editor></pdf-highlight-editor>
        <pdf-text-editor></pdf-text-editor>
        <pdf-draw-editor></pdf-draw-editor>
        <div class="verticalToolbarSeparator"></div>
        <button class="toolbar-btn" [class.active]="disableExternalLinks" [title]="disableExternalLinks ? ('readerPdf.toolbar.enableExternalLinks' | transloco) : ('readerPdf.toolbar.disableExternalLinks' | transloco)" (click)="toggleExternalLinks()">
          @if (disableExternalLinks) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          }
        </button>
        <div class="verticalToolbarSeparator"></div>
        <button class="toolbar-btn" [title]="isDarkTheme ? ('readerPdf.toolbar.switchToLightMode' | transloco) : ('readerPdf.toolbar.switchToDarkMode' | transloco)" (click)="isDarkTheme = !isDarkTheme">
          @if (isDarkTheme) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          }
        </button>
        <button id="closePdfReaderButton" class="close-reader-btn" [title]="'readerPdf.toolbar.closePdfReader' | transloco" (click)="closeReader()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </ng-template>

  @if (showBookmarkDialog) {
    <div class="bookmark-dialog-overlay" (click)="onCancelBookmark()" (keydown.escape)="onCancelBookmark()" tabindex="0" role="dialog" aria-modal="true" aria-label="Bookmark dialog">
      <div class="bookmark-dialog" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="0">
        <div class="bookmark-dialog-header">
          <span>{{ 'readerPdf.bookmark.saveBookmark' | transloco }}</span>
          <button class="bookmark-dialog-close" (click)="onCancelBookmark()">&times;</button>
        </div>
        <div class="bookmark-dialog-body">
          <label for="pdfBookmarkTitle">{{ 'readerPdf.bookmark.titleLabel' | transloco }}</label>
          <input
            #bookmarkTitleInput
            id="pdfBookmarkTitle"
            type="text"
            class="bookmark-title-input"
            [placeholder]="'readerPdf.bookmark.titlePlaceholder' | transloco"
            [(ngModel)]="bookmarkTitle"
            (keydown.enter)="onSaveBookmark()"
          />
        </div>
        <div class="bookmark-dialog-footer">
          <button class="bookmark-btn-cancel" (click)="onCancelBookmark()">{{ 'readerPdf.bookmark.cancelBookmark' | transloco }}</button>
          <button class="bookmark-btn-save" (click)="onSaveBookmark()">{{ 'readerPdf.bookmark.saveBookmark' | transloco }}</button>
        </div>
      </div>
    </div>
  }
}
