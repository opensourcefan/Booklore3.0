@if (isLoading) {
  <div class="loading-container">
    <p-progressSpinner></p-progressSpinner>
  </div>
}

@if (!isLoading) {
  <ngx-extended-pdf-viewer
    [src]="bookData"
    [authorization]="authorization"
    [textLayer]="true"
    [showHandToolButton]="true"
    [height]="'auto'"
    [theme]="isDarkTheme ? 'dark' : 'light'"
    [page]="page"
    [rotation]="rotation"
    [zoom]="zoom"
    [spread]="spread"
    [(pageViewMode)]="pageViewMode"
    [enablePrint]="canPrint"
    [customToolbar]="additionalButtons"
    (pagesLoaded)="onPdfPagesLoaded($event)"
    (pageChange)="onPageChange($event)"
    (zoomChange)="onZoomChange($event)"
    (spreadChange)="onSpreadChange($event)"
    (annotationEditorEvent)="onAnnotationEditorEvent()"
    (annotationLayerRendered)="onAnnotationLayerRendered($event)"
    (linkAnnotationsAdded)="onLinkAnnotationsAdded($event)">
  </ngx-extended-pdf-viewer>

  @if (showTouchZones) {
    <div class="pdf-touch-zones" [class.fade-out]="touchZonesFading" aria-hidden="true">
      <div class="pdf-touch-zone left">
        <span>{{ 'readerPdf.touch.previous' | transloco }}</span>
      </div>
      <div class="pdf-touch-zone right">
        <span>{{ 'readerPdf.touch.next' | transloco }}</span>
      </div>
    </div>
  }

  <ng-template #additionalButtons>
    <div id="toolbarViewer">
      <div id="toolbarViewerLeft" [class.pdf-dark]="isDarkTheme">
        <button
          type="button"
          class="toolbar-btn toolbar-btn--wide fable-panel-btn"
          [class.has-bookmarks]="bookmarks.length > 0"
          [title]="'readerPdf.toolbar.openSidebar' | transloco"
          (click)="openSidebar('bookmarks')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <button
          type="button"
          class="toolbar-btn toolbar-btn--wide pdfjs-thumbs-btn"
          [class.active]="pdfJsSidebarOpen"
          [title]="'readerPdf.toolbar.togglePageImages' | transloco"
          (click)="togglePdfJsSidebar()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        </button>
        <pdf-find-button></pdf-find-button>
        <pdf-paging-area></pdf-paging-area>
      </div>

      <div class="pdf-toolbar-middle" [class.pdf-dark]="isDarkTheme">
        <pdf-zoom-toolbar></pdf-zoom-toolbar>
        <pdf-rotate-page></pdf-rotate-page>
      </div>

      <div id="toolbarViewerRight" [class.pdf-dark]="isDarkTheme">
        <button class="toolbar-btn bookmark-btn" [class.active]="isCurrentPageBookmarked" [title]="isCurrentPageBookmarked ? ('readerPdf.toolbar.removeBookmark' | transloco) : ('readerPdf.toolbar.addBookmark' | transloco)" (click)="onToggleBookmark()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isCurrentPageBookmarked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
          </svg>
        </button>

        <div class="pdf-toolbar-menu" [class.open]="annotateMenuOpen">
          <button
            type="button"
            class="toolbar-btn pdf-menu-trigger"
            [class.active]="annotateMenuOpen || annotationEditorActive"
            [title]="'readerPdf.toolbar.annotate' | transloco"
            [attr.aria-expanded]="annotateMenuOpen"
            aria-haspopup="true"
            (click)="toggleAnnotateMenu($event)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
          @if (annotateMenuOpen) {
            <div
              class="pdf-menu-dropdown"
              [class.pdf-dark]="isDarkTheme"
              [style.--pdf-menu-top]="toolbarMenuTop"
              [style.--pdf-menu-right]="toolbarMenuRight"
              role="menu"
              tabindex="0"
              (keydown)="$event.stopPropagation()"
              (pointerdown)="$event.stopPropagation()"
              (click)="$event.stopPropagation()">
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="annotationEditorMode === annotationModes.HIGHLIGHT" (click)="onAnnotateHighlight()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>
                </svg>
                <span>{{ 'readerPdf.toolbar.annotateHighlight' | transloco }}</span>
              </button>
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="annotationEditorMode === annotationModes.FREETEXT" (click)="onAnnotateText()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>
                </svg>
                <span>{{ 'readerPdf.toolbar.annotateText' | transloco }}</span>
              </button>
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="annotationEditorMode === annotationModes.INK" (click)="onAnnotateDraw()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
                <span>{{ 'readerPdf.toolbar.annotateDraw' | transloco }}</span>
              </button>
            </div>
          }
        </div>

        <div class="pdf-toolbar-menu pdf-toolbar-menu--more" [class.open]="moreMenuOpen">
          <button
            type="button"
            class="toolbar-btn pdf-menu-trigger"
            [class.active]="moreMenuOpen"
            [title]="'readerPdf.toolbar.more' | transloco"
            [attr.aria-expanded]="moreMenuOpen"
            aria-haspopup="true"
            (click)="toggleMoreMenu($event)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
            </svg>
          </button>
          @if (moreMenuOpen) {
            <div
              class="pdf-menu-dropdown"
              [class.pdf-dark]="isDarkTheme"
              [style.--pdf-menu-top]="toolbarMenuTop"
              [style.--pdf-menu-right]="toolbarMenuRight"
              role="menu"
              tabindex="0"
              (keydown)="$event.stopPropagation()"
              (pointerdown)="$event.stopPropagation()"
              (click)="$event.stopPropagation()">
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="cursorTool === cursorTools.HAND" (click)="onMorePan()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.81l-1.47-2.32A2.4 2.4 0 0 1 4 13.5a2.4 2.4 0 0 1 3.2-1.74 2.4 2.4 0 0 1 1.6.66"/>
                </svg>
                <span>{{ 'readerPdf.toolbar.panDocument' | transloco }}</span>
              </button>
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="cursorTool === cursorTools.SELECT" (click)="onMoreSelectText()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 3v4"/><path d="M19 3v4"/><path d="M9 3h6"/><path d="M9 21h6"/><path d="M12 3v18"/><path d="M5 21v-4"/><path d="M19 21v-4"/>
                </svg>
                <span>{{ 'readerPdf.toolbar.selectText' | transloco }}</span>
              </button>
              @if (canPrint) {
                <button type="button" class="pdf-menu-item" role="menuitem" (click)="onMorePrint()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
                  </svg>
                  <span>{{ 'readerPdf.toolbar.print' | transloco }}</span>
                </button>
              }
              <button type="button" class="pdf-menu-item" role="menuitem" [class.active]="disableExternalLinks" (click)="onMoreToggleExternalLinks()">
                @if (disableExternalLinks) {
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><line x1="2" y1="2" x2="22" y2="22"/>
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                  </svg>
                }
                <span>{{ disableExternalLinks ? ('readerPdf.toolbar.enableExternalLinks' | transloco) : ('readerPdf.toolbar.disableExternalLinks' | transloco) }}</span>
              </button>
              <button type="button" class="pdf-menu-item" role="menuitem" (click)="onMoreToggleTheme()">
                @if (isDarkTheme) {
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                  </svg>
                }
                <span>{{ isDarkTheme ? ('readerPdf.toolbar.switchToLightMode' | transloco) : ('readerPdf.toolbar.switchToDarkMode' | transloco) }}</span>
              </button>
            </div>
          }
        </div>

        <span class="pdf-spread-group"
              [class.pdf-inapplicable-in-book-mode]="pageViewMode === 'book'"
              [attr.title]="pageViewMode === 'book' ? ('readerPdf.toolbar.spreadDisabledInBookMode' | transloco) : null">
          <pdf-no-spread [scrollMode]="scrollMode"></pdf-no-spread>
          <pdf-even-spread [scrollMode]="scrollMode"></pdf-even-spread>
          <pdf-odd-spread [scrollMode]="scrollMode"></pdf-odd-spread>
        </span>
        <pdf-infinite-scroll
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-infinite-scroll>
        <pdf-horizontal-scroll
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-horizontal-scroll>
        <pdf-vertical-scroll-mode
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-vertical-scroll-mode>
        <pdf-wrapped-scroll-mode
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-wrapped-scroll-mode>
        <pdf-single-page-mode
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-single-page-mode>
        <pdf-book-mode
          [pageViewMode]="pageViewMode"
          [scrollMode]="scrollMode"
          (pageViewModeChange)="onPageViewModeChange($event)">
        </pdf-book-mode>
        <div class="verticalToolbarSeparator hiddenSmallView"></div>
        <pdf-toggle-secondary-toolbar></pdf-toggle-secondary-toolbar>

        <div class="verticalToolbarSeparator pdf-close-separator" aria-hidden="true"></div>
        <button id="closePdfReaderButton" class="close-reader-btn" [title]="'readerPdf.toolbar.closePdfReader' | transloco" (click)="closeReader()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </ng-template>

  <app-pdf-sidebar
    [isOpen]="sidebarOpen"
    [closing]="sidebarClosing"
    [activeTab]="sidebarTab"
    [bookInfo]="sidebarBookInfo"
    [pages]="sidebarPages"
    [bookmarks]="bookmarks"
    [currentPage]="page"
    (dismiss)="closeSidebar()"
    (tabChange)="onSidebarTabChange($event)"
    (pageSelect)="onSidebarPageSelect($event)"
    (bookmarkSelect)="onSidebarBookmarkSelect($event)"
    (bookmarkDelete)="onSidebarBookmarkDelete($event)"
    (quickAddBookmark)="openBookmarkDialog()">
  </app-pdf-sidebar>

  <app-bookmark-title-dialog
    [visible]="showBookmarkDialog"
    [title]="bookmarkTitle"
    [defaultTitle]="bookmarkDefaultTitle"
    [placeholder]="'readerPdf.bookmark.titlePlaceholder' | transloco"
    (titleChange)="bookmarkTitle = $event"
    (save)="onSaveBookmark($event)"
    (dismissed)="onCancelBookmark()">
  </app-bookmark-title-dialog>
}
