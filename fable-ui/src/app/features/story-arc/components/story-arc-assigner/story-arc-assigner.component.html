<div class="story-arc-assigner-dialog">
  <div class="dialog-header">
    <h2>Add Selected to Story Arc</h2>
    <p class="subtitle">Assign {{ bookIds.size }} selected {{ bookIds.size === 1 ? 'book' : 'books' }} to a reading order</p>
    <p-button
      icon="pi pi-times"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      (onClick)="closeDialog()"
      class="close-button">
    </p-button>
  </div>

  <div class="mode-toggles">
    <p-button [styleClass]="!isNewArc ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
            label="Existing Arc" 
            (onClick)="toggleArcMode(false)"></p-button>
    <p-button [styleClass]="isNewArc ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
            label="New Arc" 
            (onClick)="toggleArcMode(true)"></p-button>
  </div>

  <div class="form-container">
    @if (!isNewArc) {
      <div class="form-group">
        <label for="story-arc-select">Select Story Arc</label>
        <p-select
          id="story-arc-select"
          inputId="story-arc-select"
          [options]="(storyArcs$ | async) || []"
          optionLabel="storyArcName"
          optionValue="storyArcName"
          [(ngModel)]="selectedArcName"
          (ngModelChange)="onArcSelected($event)"
          placeholder="Choose an existing arc..."
          appendTo="body"
          scrollHeight="280px"
          class="dialog-select"
        ></p-select>
      </div>

      @if (selectedArcName) {
        <div class="form-group">
          <label for="chapter-select">Target Chapter (optional)</label>
          <p-select
            id="chapter-select"
            inputId="chapter-select"
            [options]="(chapterOptions$ | async) || []"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="targetChapterIndex"
            (ngModelChange)="onChapterSelected($event)"
            placeholder="Append to last chapter..."
            appendTo="body"
            scrollHeight="280px"
            class="dialog-select"
          ></p-select>
        </div>

        @if (isNewChapter) {
          <div class="form-group">
            <label for="new-chapter-name">New Chapter Name</label>
            <input
              id="new-chapter-name"
              pInputText
              type="text"
              [(ngModel)]="newChapterName"
              placeholder="e.g., Tie-ins, Prelude..."
              class="dialog-input"
            />
          </div>

          <div class="form-group">
            <span class="field-label">Chapter Position</span>
            <div class="position-toggles">
              <p-button [styleClass]="newChapterPosition === 'above' ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
                      icon="pi pi-arrow-up"
                      label="Above"
                      (onClick)="newChapterPosition = 'above'"></p-button>
              <p-button [styleClass]="newChapterPosition === 'below' ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
                      icon="pi pi-arrow-down"
                      label="Below"
                      (onClick)="newChapterPosition = 'below'"></p-button>
            </div>
          </div>
        }

        <div class="form-group checkbox-group">
          <p-checkbox
            inputId="group-by-series"
            [(ngModel)]="groupBySeries"
            [binary]="true"
          ></p-checkbox>
          <label for="group-by-series">Auto-group by series into separate chapters</label>
        </div>
      }
    } @else {
      <div class="form-group">
        <label for="story-arc-name-input">Story Arc Name</label>
        <input
          id="story-arc-name-input"
          pInputText
          type="text"
          [(ngModel)]="customArcName"
          placeholder="Type new story arc name..."
          class="dialog-input"
        />
      </div>
    }
  </div>

  <div class="dialog-actions">
    <p-button styleClass="p-button-outlined p-button-secondary" label="Cancel" (onClick)="closeDialog()"></p-button>
    <p-button styleClass="p-button-success" label="Apply" (onClick)="applyAssignment()"></p-button>
  </div>
</div>
