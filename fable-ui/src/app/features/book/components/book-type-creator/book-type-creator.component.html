<div class="book-type-creator">
  <div class="panel-header">
    <div class="header-icon-wrapper">
      <i class="pi pi-file header-icon"></i>
    </div>
    <div class="header-text">
      <h2 class="panel-title">Create Media Type</h2>
      <p class="panel-description">Create a reusable Media Type label.</p>
    </div>
    <p-button
      icon="pi pi-times"
      (click)="cancel()"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      class="close-button"/>
  </div>

  <div class="form-container">
    <div class="form-group highlight-group">
      <label for="mediaTypeName" class="form-label">
        <i class="pi pi-file label-icon"></i>
        Media Type Name
        <span class="required-indicator">*</span>
      </label>
      <div class="input-wrapper">
        <input
          id="mediaTypeName"
          type="text"
          pInputText
          [(ngModel)]="mediaTypeName"
          class="input-full"
          placeholder="Enter media type name"
          [class.filled]="mediaTypeName.trim()"
        />
        @if (mediaTypeName.trim()) {
          <i class="pi pi-check-circle input-icon success"></i>
        }
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <div class="validation-status">
      @if (!mediaTypeName.trim()) {
        <div class="validation-message error">
          <i class="pi pi-exclamation-circle"></i>
          <span>Media Type name is required.</span>
        </div>
      } @else {
        <div class="validation-message success">
          <i class="pi pi-check-circle"></i>
          <span>Ready to create Media Type.</span>
        </div>
      }
    </div>
    <div class="footer-actions">
      <p-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancel()"
      />
      <p-button
        label="Create"
        icon="pi pi-plus"
        severity="success"
        (onClick)="createBookType()"
        [disabled]="!mediaTypeName.trim()"
      />
    </div>
  </div>
</div>
