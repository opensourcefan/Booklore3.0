<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Fable</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png?v=6"/>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon-180x180.png?v=6"/>
  <link rel="manifest" href="manifest.webmanifest?v=6">
</head>

<body>
<script>
  (function() {
    try {
      // Keep detectors aligned with MobileUxService.getBreakpointForCurrentViewport().
      var layoutMode = localStorage.getItem('bl-layout-mode') || 'auto';
      var phoneBreakpoint = parseInt(localStorage.getItem('bl-phone-breakpoint') || '767', 10);
      var tabletBreakpoint = parseInt(localStorage.getItem('bl-tablet-breakpoint') || '1024', 10);
      var width = window.innerWidth;
      var height = window.innerHeight;

      function isPhoneLayout() {
        if (layoutMode === 'phone') return true;
        if (layoutMode === 'tablet' || layoutMode === 'desktop') return false;
        if (layoutMode === 'auto-shape') return width <= phoneBreakpoint;
        return width <= phoneBreakpoint;
      }

      function isTabletLayout() {
        if (layoutMode === 'tablet') return true;
        if (layoutMode === 'phone' || layoutMode === 'desktop') return false;
        if (layoutMode === 'auto-shape') {
          if (width <= phoneBreakpoint) return false;
          return height > width;
        }
        return width > phoneBreakpoint && width <= tabletBreakpoint;
      }

      var phoneHeaderPos = localStorage.getItem('bl-header-position');
      var tabletHeaderPos = localStorage.getItem('bl-tablet-header-position');
      if ((phoneHeaderPos === 'bottom' && isPhoneLayout()) ||
          (tabletHeaderPos === 'bottom' && isTabletLayout())) {
        document.body.classList.add('header-bottom');
      }
    } catch(e) {}
  })();
</script>
<app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
