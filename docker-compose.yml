services:
  booklore:
    # M6 NOTE: image:latest is mutable — the same tag may resolve to a different image
    # after 'docker compose pull'.  For reproducible deployments pin to a specific
    # semantic-version tag or SHA digest, e.g.:
    #   image: ghcr.io/opensourcefan/booklore3:3.2.1
    #   image: ghcr.io/opensourcefan/booklore3@sha256:<digest>
    image: ghcr.io/opensourcefan/booklore3:latest
    container_name: booklore
    environment:
      - USER_ID=${APP_USER_ID}
      - GROUP_ID=${APP_GROUP_ID}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DISK_TYPE=${DISK_TYPE}
      - TELEMETRY_ENABLED=false
      - AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:-http://booklore-ai-panel:8080}
      # CORS / Cross-origin access:
      # Leave ALLOWED_ORIGINS unset (default) for same-origin deployments (most common).
      # Set to your frontend URL only when the UI is served from a different origin:
      #   ALLOWED_ORIGINS=https://books.example.com
      # WARNING: ALLOWED_ORIGINS=* is insecure — it allows any website to make
      # credentialed cross-origin requests to the API while a user session is active.
      # - ALLOWED_ORIGINS=
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "6060:6060"
    volumes:
      - ./data:/app/data
      - ./books:/books
      - ./bookdrop:/bookdrop
      - ./docker/rar:/opt/booklore-rar:ro
    restart: unless-stopped

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.10
    container_name: mariadb
    environment:
      - PUID=${DB_USER_ID}
      - PGID=${DB_GROUP_ID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - REMOTE_USER_PASSWORD=${REMOTE_USER_PASSWORD}
    volumes:
      - ./mariadb/config:/config
      - ./mariadb/conf.d:/config/mariadb/conf.d
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  booklore-ai-panel:
    image: ${AI_PANEL_IMAGE:-ghcr.io/opensourcefan/booklore-panel-ai:latest}
    container_name: booklore-ai-panel
    profiles: ["ai"]
    environment:
      - TZ=${TZ}
      - MODEL_ID=${AI_MODEL_ID:-mosesb/best-comic-panel-detection}
      - HF_HOME=/models
    volumes:
      - ./data/ai-models:/models
    ports:
      - "${AI_PANEL_PORT:-18080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
