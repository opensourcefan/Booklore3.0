version: 2
updates:
  # Backend – Gradle (Java / Spring)
  - package-ecosystem: "gradle"
    directory: "/fable-api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "com.github.RouHim:jaudiotagger"

  # Frontend – npm (Angular)
  - package-ecosystem: "npm"
    directory: "/fable-ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular-framework:
        patterns:
          - "@angular/*"
      other-npm-dependencies:
        patterns:
          - "*"
          - "!@angular/*"
    ignore:
      - dependency-name: "ngx-extended-pdf-viewer"
        versions:
          - ">=26"
      - dependency-name: "typescript"
        versions:
          - ">=6"

  # AI panel – pip
  - package-ecosystem: "pip"
    directory: "/docker/ai-panel"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Root Dockerfiles
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # AI panel Dockerfile
  - package-ecosystem: "docker"
    directory: "/docker/ai-panel"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Example Docker Compose files
  - package-ecosystem: "docker-compose"
    directory: "/example-docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
