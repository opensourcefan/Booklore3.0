name: Dependabot automation

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Detect workflow file changes
        id: changed-files
        run: |
          if gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -q '^\.github/workflows/'; then
            echo "has_workflow_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_workflow_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine merge policy
        id: policy
        run: |
          update_type="${{ steps.dependabot-metadata.outputs.update-type }}"
          workflow_changes="${{ steps.changed-files.outputs.has_workflow_changes }}"
          auto_merge=false
          review_reason=""

          case "$update_type" in
            version-update:semver-patch)
              auto_merge=true
              ;;
            *)
              review_reason="Requires manual review because Dependabot marked it as minor/major update (${update_type:-unknown})."
              ;;
          esac

          if [[ "$auto_merge" == "true" && "$workflow_changes" == "true" ]]; then
            auto_merge=false
            review_reason="Requires manual review because workflow file changes are not auto-merged by the default Actions token."
          fi

          echo "auto_merge=$auto_merge" >> "$GITHUB_OUTPUT"
          echo "review_reason=$review_reason" >> "$GITHUB_OUTPUT"

          {
            echo "### Dependabot policy"
            echo "- Update type: ${update_type:-unknown}"
            echo "- Workflow file changes: $workflow_changes"
            echo "- Auto-merge eligible: $auto_merge"
            if [[ -n "$review_reason" ]]; then
              echo "- Reason: $review_reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: High-Risk Package Override (Force Manual Review)
        id: high-risk
        if: steps.policy.outputs.auto_merge == 'true'
        env:
          DEPS_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
        run: |
          # Hibernate ORM and Spring Boot are framework-level dependencies that
          # can introduce subtle runtime regressions not caught by unit tests
          # (e.g., FetchMode.SUBSELECT + EntityGraph interaction change in
          # Hibernate 7.4.1). Force manual review even for patch bumps.
          high_risk_patterns='org.hibernate.orm:hibernate-core|org.springframework.boot:spring-boot-starter-data-jpa'

          if echo "$DEPS_JSON" | jq -r '.[].dependencyName' | grep -qE "$high_risk_patterns"; then
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            echo "review_reason=High-risk package (Hibernate ORM or Spring Boot) detected — forcing manual review regardless of semver level." >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ High-Risk Package Override"
              echo "A Hibernate ORM or Spring Boot dependency was detected in this PR."
              echo "These are framework-level packages that can introduce subtle runtime regressions."
              echo "Auto-merge has been **blocked** — manual review is required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce Dependency Quarantine (7-Day Hold)
        id: quarantine-check
        if: steps.policy.outputs.auto_merge == 'true'
        env:
          DEPS_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
        run: |
          under_quarantine=false

          while read -r dep_name dep_version dep_ecosystem; do
            if [ -z "$dep_name" ] || [ "$dep_name" = "null" ]; then
              continue
            fi
            
            echo "Checking release age of $dep_name ($dep_version) on ecosystem $dep_ecosystem..."
            publish_date=""

            if [ "$dep_ecosystem" = "npm" ] || [ "$dep_ecosystem" = "npm_and_yarn" ]; then
              # Query NPM Registry API for publish time
              publish_date=$(curl -s "https://registry.npmjs.org/${dep_name}" | jq -r ".time[\"${dep_version}\"]" 2>/dev/null || echo "")
            elif [ "$dep_ecosystem" = "gradle" ] || [ "$dep_ecosystem" = "maven" ]; then
              group_id=$(echo "$dep_name" | cut -d: -f1)
              artifact_id=$(echo "$dep_name" | cut -d: -f2)
              query_url="https://search.maven.org/solrsearch/select?q=g:${group_id}+AND+a:${artifact_id}+AND+v:${dep_version}&wt=json"
              response=$(curl -s "$query_url" || echo "")
              timestamp=$(echo "$response" | grep -oE '"timestamp":[0-9]+' | cut -d: -f2 || echo "")
              if [ -n "$timestamp" ]; then
                publish_date=$(date -d "@$((timestamp / 1000))" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "")
              fi
            elif [ "$dep_ecosystem" = "pip" ]; then
              query_url="https://pypi.org/pypi/${dep_name}/json"
              response=$(curl -s "$query_url" || echo "")
              publish_date=$(echo "$response" | jq -r ".releases[\"${dep_version}\"][0].upload_time_iso_8601" 2>/dev/null || echo "")
              if [ -z "$publish_date" ] || [ "$publish_date" = "null" ]; then
                publish_date=$(echo "$response" | jq -r ".releases[\"${dep_version}\"][0].upload_time" 2>/dev/null || echo "")
              fi
            fi

            if [ "$publish_date" = "null" ]; then
              publish_date=""
            fi

            if [ -n "$publish_date" ]; then
              publish_ts=$(date -d "$publish_date" +%s)
              current_ts=$(date +%s)
              age_seconds=$((current_ts - publish_ts))
              age_days=$((age_seconds / 86400))
              echo "Package $dep_name version $dep_version was published on $publish_date ($age_days days ago)."
              if [ "$age_days" -lt 7 ]; then
                echo "⚠️ Package $dep_name is under quarantine hold (7-day rule)."
                under_quarantine=true
              fi
            else
              if [ "$dep_ecosystem" = "npm" ] || [ "$dep_ecosystem" = "npm_and_yarn" ] || [ "$dep_ecosystem" = "gradle" ] || [ "$dep_ecosystem" = "maven" ] || [ "$dep_ecosystem" = "pip" ]; then
                echo "⚠️ Could not verify publication date for supported package $dep_name. Fail-safe quarantine activated."
                under_quarantine=true
              else
                echo "ℹ️ Ecosystem '$dep_ecosystem' publish date verification not supported for $dep_name. Skipping quarantine check."
              fi
            fi
          done < <(echo "$DEPS_JSON" | jq -r '.[] | "\(.dependencyName) \(.newVersion) \(.packageEcosystem)"')

          if [ "$under_quarantine" = "true" ]; then
            echo "⚠️ Auto-merge is blocked due to quarantine hold."
          else
            echo "✅ All packages have cleared the 7-day quarantine threshold."
          fi

          echo "under_quarantine=$under_quarantine" >> "$GITHUB_OUTPUT"

      - name: Label PR for auto-merge
        if: steps.policy.outputs.auto_merge == 'true' && steps.quarantine-check.outputs.under_quarantine != 'true'
        run: |
          existing_labels=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if grep -Fxq 'dependabot:manual-review' <<< "$existing_labels"; then
            gh pr edit "$PR_URL" --remove-label 'dependabot:manual-review'
          fi
          if ! grep -Fxq 'dependabot:automerge' <<< "$existing_labels"; then
            gh pr edit "$PR_URL" --add-label 'dependabot:automerge'
          fi

      - name: Label PR for manual review
        if: steps.policy.outputs.auto_merge != 'true' || steps.quarantine-check.outputs.under_quarantine == 'true'
        run: |
          existing_labels=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if grep -Fxq 'dependabot:automerge' <<< "$existing_labels"; then
            gh pr edit "$PR_URL" --remove-label 'dependabot:automerge'
          fi
          if ! grep -Fxq 'dependabot:manual-review' <<< "$existing_labels"; then
            gh pr edit "$PR_URL" --add-label 'dependabot:manual-review'
          fi

      - name: Enable auto-merge
        if: steps.policy.outputs.auto_merge == 'true' && steps.quarantine-check.outputs.under_quarantine != 'true'
        run: |
          gh pr merge "$PR_URL" --auto --squash
