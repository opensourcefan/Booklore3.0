name: Develop & PR – Build, Test, and Container Publish

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  migration-check:
    name: Flyway Migration Check
    uses: ./.github/workflows/migrations-check.yml
    with:
      base_ref: 'develop'
      head_ref: 'HEAD'

  backend-tests:
    name: Backend Tests
    needs: [ migration-check ]
    if: needs.migration-check.result == 'success' || needs.migration-check.result == 'skipped'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set Up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Execute Backend Tests
        id: backend_tests
        working-directory: ./fable-api
        env:
          FABLE_TEST_MAX_HEAP: 3g
        run: |
          echo "Running backend tests with heap ${FABLE_TEST_MAX_HEAP}..."
          ./gradlew test --no-daemon --build-cache
        continue-on-error: true

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        if: always()
        with:
          files: fable-api/build/test-results/**/*.xml
          check_name: Backend Test Results

      - name: Upload Backend Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-reports
          path: |
            fable-api/build/reports/tests/
            fable-api/build/test-results/
          retention-days: 30

      - name: Validate Backend Test Results
        if: steps.backend_tests.outcome == 'failure'
        run: |
          echo "❌ Backend tests failed"
          exit 1

  frontend-tests:
    name: Frontend Tests
    needs: [ migration-check ]
    if: needs.migration-check.result == 'success' || needs.migration-check.result == 'skipped'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fable-ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./fable-ui
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: ./fable-ui
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate Dependency Tree
        working-directory: ./fable-ui
        run: npm ls --depth=0


      - name: Execute Frontend Tests
        id: frontend_tests
        working-directory: ./fable-ui
        run: |
          echo "Running frontend tests..."
          npx vitest run
        continue-on-error: true

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        if: always()
        with:
          files: fable-ui/test-results/vitest-results.xml
          check_name: Frontend Test Results

      - name: Upload Frontend Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-reports
          path: |
            fable-ui/test-results/vitest-results.xml
          retention-days: 30

      - name: Validate Frontend Test Results
        if: steps.frontend_tests.outcome == 'failure'
        run: |
          echo "❌ Frontend tests failed"
          exit 1

  build-and-push:
    name: Build and Push Container
    needs: [ backend-tests, frontend-tests ]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Image tagging
      # ----------------------------------------
      - name: Generate Image Tag
        id: set_image_tag
        run: |
          short_sha=$(git rev-parse --short HEAD)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            image_tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            image_tag="develop-${short_sha}"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

          {
            echo "main_tags<<EOF"
            echo "ghcr.io/opensourcefan/fable:${image_tag}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "ghcr.io/opensourcefan/fable:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ai_tags<<EOF"
            echo "ghcr.io/opensourcefan/fable-panel-ai:${image_tag}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "ghcr.io/opensourcefan/fable-panel-ai:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ai_search_tags<<EOF"
            echo "ghcr.io/opensourcefan/fable-search-ai:${image_tag}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "ghcr.io/opensourcefan/fable-search-ai:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Image tag: $image_tag"

      # ----------------------------------------
      # Native Angular build
      # ----------------------------------------
      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fable-ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./fable-ui
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: ./fable-ui
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate Dependency Tree
        working-directory: ./fable-ui
        run: npm ls --depth=0


      - name: Build Angular App
        working-directory: ./fable-ui
        run: npx ng build --configuration=production

      # ----------------------------------------
      # Native Gradle build
      # ----------------------------------------
      - name: Set Up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Copy Angular Dist to Spring Boot Resources
        run: cp -r fable-ui/dist/app/browser/. fable-api/src/main/resources/static/

      - name: Inject Version into application.yaml
        env:
          APP_VERSION: ${{ steps.set_image_tag.outputs.image_tag }}
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq eval '.app.version = strenv(APP_VERSION)' -i fable-api/src/main/resources/application.yaml

      - name: Build Spring Boot JAR
        working-directory: ./fable-api
        run: ./gradlew clean build -x test --no-daemon --parallel --build-cache

      - name: Prepare Spring Boot Artifact for Container Build
        run: |
          jar_path=$(ls fable-api/build/libs/fable-api-*.jar | grep -v -- '-plain\.jar$' | head -n 1)
          if [ -z "$jar_path" ]; then
            echo "❌ No Spring Boot executable JAR found in fable-api/build/libs"
            exit 1
          fi
          cp "$jar_path" fable-api/build/libs/app.jar
          echo "Using JAR: $jar_path"

      # ----------------------------------------
      # Environment setup
      # ----------------------------------------
      - name: Set Up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # ----------------------------------------
      # Docker login (pushes & internal PRs only)
      # ----------------------------------------

      - name: Authenticate to GitHub Container Registry
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ----------------------------------------
      # Docker build & push (push + internal PRs)
      # ----------------------------------------
      - name: Build and push Docker image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.set_image_tag.outputs.main_tags }}
          build-args: |
            APP_VERSION=${{ steps.set_image_tag.outputs.image_tag }}
            APP_REVISION=${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/opensourcefan/fable:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/opensourcefan/fable:buildcache,mode=max

      - name: Build and push AI Docker image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./docker/ai-panel
          file: ./docker/ai-panel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.set_image_tag.outputs.ai_tags }}
          cache-from: |
            type=gha,scope=fable-panel-ai
            type=registry,ref=ghcr.io/opensourcefan/fable-panel-ai:buildcache
          cache-to: |
            type=gha,scope=fable-panel-ai,mode=max
            type=registry,ref=ghcr.io/opensourcefan/fable-panel-ai:buildcache,mode=max

      - name: Build and push AI Search Docker image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./docker/ai-search
          file: ./docker/ai-search/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.set_image_tag.outputs.ai_search_tags }}
          cache-from: |
            type=gha,scope=fable-search-ai
            type=registry,ref=ghcr.io/opensourcefan/fable-search-ai:buildcache
          cache-to: |
            type=gha,scope=fable-search-ai,mode=max
            type=registry,ref=ghcr.io/opensourcefan/fable-search-ai:buildcache,mode=max
