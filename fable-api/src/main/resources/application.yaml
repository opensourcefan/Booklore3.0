app:
  path-config: '/app/data'
  bookdrop-folder: '/bookdrop'
  version: 'development'

  cors:
    # Comma-separated list of allowed CORS origins for both HTTP and WebSocket endpoints.
    # SECURITY: Leave unset or empty (default) to allow same-origin requests only.
    # Setting ALLOWED_ORIGINS=* (wildcard) is INSECURE: it allows any website to make
    # credentialed cross-origin requests to this API (CORS credential-exfiltration risk).
    # For cross-origin / reverse-proxy deployments set this to your explicit frontend origin:
    #   ALLOWED_ORIGINS=https://books.example.com
    # Multiple origins (comma-separated):
    #   ALLOWED_ORIGINS=https://books.example.com,https://mobile.example.com
    allowed-origins: ${ALLOWED_ORIGINS:}

  remote-auth:
    enabled: ${REMOTE_AUTH_ENABLED:false}
    create-new-users: ${REMOTE_AUTH_CREATE_NEW_USERS:true}
    header-name: ${REMOTE_AUTH_HEADER_NAME:Remote-Name}
    header-user: ${REMOTE_AUTH_HEADER_USER:Remote-User}
    header-email: ${REMOTE_AUTH_HEADER_EMAIL:Remote-Email}
    header-groups: ${REMOTE_AUTH_HEADER_GROUPS:Remote-Groups}
    admin-group: ${REMOTE_AUTH_ADMIN_GROUP}
    groups-delimiter: ${REMOTE_AUTH_GROUPS_DELIMITER:\\s+}
  geo-ip:
    # PRIVACY: GeoIP country-code lookup is disabled by default. When enabled it sends
    # each unique visitor IP address to ip-api.com (HTTPS). Enable only if you need
    # country codes in the audit log and accept the associated privacy trade-off.
    enabled: ${GEO_IP_ENABLED:false}

  force-disable-oidc: ${FORCE_DISABLE_OIDC:false}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://app-ai-panel:8080}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:30000}
  ai-search:
    base-url: ${AI_SEARCH_SERVICE_BASE_URL:http://fable-ai-search:8080}
    embedding-model: ${AI_SEARCH_EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
    connect-timeout-ms: ${AI_SEARCH_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SEARCH_SERVICE_READ_TIMEOUT_MS:120000}
  disk-type: ${DISK_TYPE:LOCAL}

server:
  max-http-header-size: 128KB
  forward-headers-strategy: native
  port: ${FABLE_PORT:6060}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml,application/xml,application/atom+xml
    min-response-size: 1024
  tomcat:
    relaxed-query-chars: '[,],%,{,},|'

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: 600000
  application:
    name: ${APP_NAME:fable}-api
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://${DATABASE_HOST:${DB_HOST:mariadb}}:${DATABASE_PORT:3306}/${DATABASE_NAME:fable}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    hikari:
      pool-name: ${APP_NAME:Fable}HikariPool
      max-lifetime: 580000         # 9.6 minutes (avoid DB-side connection cuts)
      connection-test-query: SELECT 1
      connection-timeout: 10000    # 10s to acquire a connection before timeout
      maximum-pool-size: 20        # Higher ceiling for virtual-thread bursts
      minimum-idle: 5              # Keep warm connections ready
      idle-timeout: 300000         # 5 minutes before idle connections are closed
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        query:
          timeout: 10              # 10s max for any HQL/JPQL query
          fail_on_pagination_over_collection_fetch: true
        jdbc:
          time_zone: UTC
          batch_size: 500
          order_inserts: true
          order_updates: true
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.booklore: ${LOG_LEVEL:INFO}
    org.apache.fontbox: ERROR
    org.apache.pdfbox: ERROR
    org.quartz.core.QuartzScheduler: WARN
    org.quartz.simpl.SimpleThreadPool: WARN
    org.quartz.simpl.RAMJobStore: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR